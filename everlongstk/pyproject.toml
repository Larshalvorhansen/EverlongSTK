[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "everlong-stk"
version = "0.0.1"
description = "A maintainable satellite power and data budget simulator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "pyqtgraph>=0.13,<1",
]

[project.scripts]
everlong-stk = "everlong_stk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
